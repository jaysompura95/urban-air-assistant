name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate Module Imports
      run: |
        python -c "import api_service; import impact_calculator; import iaq_hacks; import routines_generator; import community_hub; import genai_engine; print('All core modules validated!')"

    - name: Test Core Calculation Engines
      run: |
        python -c "
        import impact_calculator
        exp = impact_calculator.calculate_personal_exposure(150.0)
        assert exp['reduction_pct'] > 50, 'Mitigation should reduce exposure'
        cadr = impact_calculator.calculate_cadr_and_ach(300, 9.0)
        assert cadr['ach'] > 2.0, 'Corsi-Rosenthal box must achieve adequate ACH'
        print('Mathematical & scientific models verified!')
        "
